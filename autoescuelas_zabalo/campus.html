<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus alumnos · Autoescuela Zabalo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="campus.css">
</head>
<body class="acceso">

  <main class="acceso__caja">
    <a class="marca" href="index.html"><span class="marca__placa" aria-hidden="true">L</span>Zabalo</a>

    <h1>Campus de alumnos</h1>
    <p class="acceso__intro">Entra con el DNI que diste al matricularte y la contraseña que te dimos en la oficina.</p>

    <!-- Maqueta: el formulario no valida nada, solo lleva al panel de ejemplo -->
    <form class="formulario" action="panel.html">
      <label for="dni">DNI o NIE</label>
      <input id="dni" name="dni" type="text" autocomplete="username" placeholder="12345678A">

      <label for="clave">Contraseña</label>
      <input id="clave" name="clave" type="password" autocomplete="current-password">

      <button class="boton boton--azul" type="submit">Entrar</button>
    </form>

    <p class="acceso__ayuda">¿No recuerdas la contraseña? Pídela por <a href="https://wa.me/34691849165" target="_blank" rel="noopener">WhatsApp</a> o en cualquiera de los dos centros.</p>
    <p class="acceso__aviso">Maqueta de prueba: pulsa Entrar sin rellenar nada para ver el panel.</p>
  </main>

  <div class="acceso__carretera" aria-hidden="true"></div>

  <script>
    // Maqueta: no envía datos a ningún sitio, solo abre el panel
    document.querySelector('.formulario').addEventListener('submit', (e) => {
      e.preventDefault();
      location.href = 'panel.html';
    });
  </script>
</body>
</html>
